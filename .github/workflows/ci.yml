# MergeMind CI — runs the full quality suite on pushes to main and
# pull requests targeting main.
#
# Teammate contract: if this workflow is green, your branch is safe to merge.
# Run the same gates locally before pushing: `pnpm check`
#
# Every step must pass — there are intentionally no `|| true` fallbacks or
# `continue-on-error` flags. A red gate blocks merge.

name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref so stale green checks cannot mask
# a newer red run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: build · typecheck · lint · test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.6.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Test
        run: pnpm test
