# MergeMind CI — runs the full quality suite on every push and pull request.
#
# Teammate contract: if this workflow is green, your branch is safe to merge.
# Run the same gates locally before pushing: `pnpm check`

name: ci

on:
  push:
  pull_request:

jobs:
  quality:
    name: build · typecheck · lint · test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Test
        run: pnpm test
